# English NLU eval cases (PLAN §11.2). Same conventions as cases.he.yaml.
# Reference clock: Thursday 24 Sep 2026 21:00 Asia/Jerusalem.
# No real names, numbers or addresses appear anywhere in this file.

# ---------------------------------------------------------------- reminders: relative
- id: en-rem-001
  now: "2026-09-24T21:00:00+03:00"
  input: "remind me tomorrow at 8 to call dad"
  expect:
    intent: reminders.create
    slots:
      date: { kind: relative_days, offset: 1 }
      time: { hour: 8, minute: 0, meridiem: unspecified, part_of_day: unspecified }
    missing: []

- id: en-rem-002
  now: "2026-09-24T21:00:00+03:00"
  input: "remind me today at 23:00 to turn off the oven"
  expect:
    intent: reminders.create
    slots:
      date: { kind: relative_days, offset: 0 }
      time: { hour: 23, minute: 0, meridiem: unspecified, part_of_day: unspecified }
    missing: []

- id: en-rem-003
  now: "2026-09-24T21:00:00+03:00"
