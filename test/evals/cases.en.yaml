# ---------------------------------------------------------------- calendar
- id: en-cal-001
  now: "2026-09-24T21:00:00+03:00"
  input: "what's on my calendar tomorrow"
  expect:
    intent: calendar.list_events
    slots:
      date: { kind: relative_days, offset: 1 }
    missing: []

- id: en-cal-002
  now: "2026-09-24T21:00:00+03:00"
  input: "what do I have today"
  expect:
    intent: calendar.list_events
    slots:
      date: { kind: relative_days, offset: 0 }
    missing: []

- id: en-cal-003
  now: "2026-09-24T21:00:00+03:00"
  input: "what's my schedule this week"
  expect:
    intent: calendar.list_events
    slots:
      range: this_week
    missing: []

- id: en-cal-004
  now: "2026-09-24T21:00:00+03:00"
  input: "what's on my calendar"
  expect:
    intent: calendar.list_events
    missing: [date]

- id: en-cal-010
  now: "2026-09-24T21:00:00+03:00"
  input: "schedule a meeting with Sarah tomorrow at 14:00"
  expect:
    intent: calendar.create_event
    slots:
      date: { kind: relative_days, offset: 1 }
      time: { hour: 14, minute: 0, meridiem: unspecified, part_of_day: unspecified }
    missing: []

- id: en-cal-011
  now: "2026-09-24T21:00:00+03:00"
  input: "book a meeting with the team tomorrow"
  expect:
    intent: calendar.create_event
    slots:
      date: { kind: relative_days, offset: 1 }
    missing: [time]

- id: en-cal-012
  now: "2026-09-24T21:00:00+03:00"
  input: "schedule a 30 minute call on Monday at 10am"
  # A bare "call" names the kind of event, not the event — the English twin of
  # he-cal-013. Listed as missing since prompt v5 (2026-09-26), which made the
  # rule explicit; before that this case silently accepted "call" as a title.
  expect:
    intent: calendar.create_event
    slots:
      duration_minutes: 30
      date: { kind: weekday, weekday: 1, qualifier: unspecified }
    missing: [title]

- id: en-cal-013
  now: "2026-09-24T21:00:00+03:00"
  input: "set up a meeting"
  expect:
    intent: calendar.create_event
    missing: [title, date, time]

- id: en-cal-020
  now: "2026-09-24T21:00:00+03:00"
  input: "move the meeting with Sarah from 14:00 to 16:00"
  expect:
    intent: calendar.move_event
    missing: []

- id: en-cal-021
  now: "2026-09-24T21:00:00+03:00"
  input: "push the standup to tomorrow at 10:00"
  expect:
    intent: calendar.move_event
    slots:
      to_date: { kind: relative_days, offset: 1 }
      to_time: { hour: 10, minute: 0, meridiem: unspecified, part_of_day: unspecified }
    missing: []

- id: en-cal-030
  now: "2026-09-24T21:00:00+03:00"
  input: "cancel tomorrow's meeting with Sarah"
  expect:
    intent: calendar.delete_event
    slots:
      date: { kind: relative_days, offset: 1 }
    missing: []

- id: en-cal-031
  now: "2026-09-24T21:00:00+03:00"
  input: "delete the Monday standup"
  expect:
    intent: calendar.delete_event
    slots:
      date: { kind: weekday, weekday: 1, qualifier: unspecified }
    missing: []

