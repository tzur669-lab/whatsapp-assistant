  expect:
    intent: reminders.create
    slots:
      date: { kind: relative_days, offset: 1 }
      time: { hour: 8, minute: 0, meridiem: pm, part_of_day: unspecified }
    missing: []

- id: en-rem-004
  now: "2026-09-24T21:00:00+03:00"
  input: "remind me tomorrow at 8 in the morning to take my pills"
  expect:
    intent: reminders.create
    slots:
      time: { hour: 8, minute: 0, meridiem: unspecified, part_of_day: morning }
    missing: []

- id: en-rem-005
  now: "2026-09-24T21:00:00+03:00"
  input: "remind me the day after tomorrow at 9 to pay the bill"
  expect:
