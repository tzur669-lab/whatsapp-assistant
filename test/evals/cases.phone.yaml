# Phone-action cases for the agent eval (PLAN §6.20, §11.11). Agent-only:
# `pnpm eval` (the parser) never loads this file.
#
# Same shape as cases.he.yaml: `expect.slots` lists only the slots that must
# match exactly; `expect.missing` lists slots that must NOT be filled.
# No real names, numbers or places appear here.

- id: ph-alarm-001
  now: "2026-09-24T21:00:00+03:00"
  input: "תעיר אותי מחר ב-6:30"
  expect:
    intent: alarm.set
    slots:
      time: { hour: 6, minute: 30, meridiem: unspecified, part_of_day: unspecified }
    missing: []

- id: ph-alarm-002
  now: "2026-09-24T21:00:00+03:00"
  input: "תכוון לי שעון מעורר לשבע בבוקר"
  expect:
    intent: alarm.set
    slots:
      time: { hour: 7, minute: 0, meridiem: unspecified, part_of_day: morning }
    missing: []

- id: ph-alarm-003
  now: "2026-09-24T21:00:00+03:00"
  input: "תעיר אותי"
  expect:
    intent: alarm.set
    missing: [time]

