# Hebrew NLU eval cases (PLAN §11.2).
#
# `expect.slots` lists only the slots that must match exactly. `expect.missing`
# lists slots the model must declare as absent — a slot named there must NOT
# appear in `slots`, which is how the "no invented slots" gate is measured.
#
# Reference clock for most cases: Thursday 24.9.2026 21:00 Asia/Jerusalem.
# No real names, numbers or addresses appear anywhere in this file.

# ---------------------------------------------------------------- reminders: relative
- id: he-rem-001
  now: "2026-09-24T21:00:00+03:00"
  input: "תזכיר לי מחר ב-8 להתקשר לאבא"
  expect:
    intent: reminders.create
    slots:
      date: { kind: relative_days, offset: 1 }
      time: { hour: 8, minute: 0, meridiem: unspecified, part_of_day: unspecified }
    missing: []

- id: he-rem-002
  now: "2026-09-24T21:00:00+03:00"
  input: "תזכיר לי היום ב-23:00 לכבות את התנור"
  expect:
