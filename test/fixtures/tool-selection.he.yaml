# Tool selection fixture (PLAN §6.19 §4, 2026-10-06).
#
# Synthetic requests, never real user messages. Each case lists what the
# selection may be: one group, or `full` (the whole catalog). A selection
# outside `allow` is a failure — above all a single *wrong* group, which would
# hide the tool the request needs. `full` is always safe; it only costs tokens.
#
# Groups: time, records, info, mail, drive, phone.

clean:
  - { text: "תזכיר לי מחר בשמונה בבוקר לקחת את הכדור", allow: [time] }
  - { text: "מה יש לי ביומן ביום חמישי?", allow: [time] }
  - { text: "תקבע לי פגישה עם רונית ביום ראשון בעשר", allow: [time] }
  - { text: "תזיז את הפגישה של מחר לארבע", allow: [time] }
  - { text: "תבטל את התזכורת על החשמל", allow: [time] }
  - { text: "יש לי זמן פנוי השבוע אחרי הצהריים?", allow: [time] }
  - { text: "אילו תזכורות יש לי?", allow: [time] }
  - { text: "תזכיר לי לצאת לפגישה עם דני חצי שעה לפני", allow: [time, full] }
  - { text: "remind me tomorrow at 9 to pay rent", allow: [time] }
  - { text: "תרשום לי פתק: הקוד של הלוקר הוא בצד שמאל", allow: [records] }
  - { text: "הוצאתי 40 שקל על קפה", allow: [records] }
  - { text: "כמה הוצאתי החודש על דלק?", allow: [records] }
  - { text: "תוסיף משימה לקנות נורות", allow: [records] }
  - { text: "מה נשאר לי לעשות ברשימת המשימות?", allow: [records] }
  - { text: "תייצא לי את ההוצאות לאקסל", allow: [records] }
  - { text: "מה מזג האוויר בתל אביב?", allow: [info] }
  - { text: "כמה זה 15% מ-240?", allow: [info] }
  - { text: "מתי השקיעה היום?", allow: [info] }
  - { text: "יש מייל חדש מהבנק?", allow: [mail] }
  - { text: "תחפש בדרייב את המסמך של החוזה", allow: [drive] }
  - { text: "תתקשר לאמא", allow: [phone] }
  - { text: "תעיר אותי בשש וחצי", allow: [phone, time] }
  - { text: "תנווט לעבודה", allow: [phone] }
  - { text: "תנגן שיר של עומר אדם", allow: [phone] }
  - { text: "תשים טיימר לעשר דקות", allow: [phone] }
  - { text: "מה ההתראות האחרונות שלי?", allow: [phone, full] }
  # Reminders called "alerts" (2026-10-06): never the phone group alone.
  - { text: "איזה התראות פעילות יש לי?", allow: [full, time] }
  - { text: "תבטל את ההתראה לכבות את האש", allow: [full, time] }
  - { text: "תכבה את כל ההתראות שקבעתי", allow: [full, time] }
  - { text: "set an alert for 7am", allow: [full, phone] }
  # Block E (2026-10-06).
  - { text: "של מי יום הולדת השבוע?", allow: [time] }
  - { text: "אילו חשבונות לתשלום הגיעו במייל?", allow: [mail] }
  - { text: "מי התקשר אליי היום?", allow: [phone] }
  - { text: "פספסתי שיחות?", allow: [phone] }
  - { text: "תנגן אריק איינשטיין בספוטיפיי", allow: [phone] }

# Natural phrasings without the obvious tool word. The right group, or full.
natural:
  - { text: "אל תיתן לי לשכוח את יום ההולדת של נועה ביום שלישי", allow: [time, full] }
  - { text: "מה אני עושה מחר בערב?", allow: [time, full] }
  - { text: "שילמתי 120 על החשמל", allow: [records, full] }
  - { text: "עלה לי 35 הסנדוויץ'", allow: [records, full] }
  - { text: "צריך לקנות חלב, תכניס לרשימה", allow: [records, full] }
  - { text: "יירד היום גשם?", allow: [info, full] }
  - { text: "מי היה בן גוריון?", allow: [info, full] }
  - { text: "מה כתוב באחרון שקיבלתי מהעבודה?", allow: [mail, full] }
  - { text: "איך מגיעים לקניון הכי קרוב?", allow: [phone, full] }
  - { text: "תוריד קצת את הבהירות", allow: [phone, full] }
  - { text: "מה המספר של יוסי?", allow: [phone, full] }

# Mixed requests: two domains, so the full catalog.
mixed:
  - { text: "תזכיר לי מחר להתקשר לאמא", allow: [time, full] }
  - { text: "תשלח לדני מייל שאני מאחר לפגישה", allow: [full] }
  - { text: "תזכיר לי לרשום את ההוצאה על הדלק", allow: [full] }
  - { text: "תבדוק אם יש לי זמן מחר ותשלח לו הודעה", allow: [full] }
  - { text: "תחשב כמה הוצאתי על אוכל השבוע", allow: [records, full] }

# Words that point at one group while the right action is elsewhere, or is a read.
discriminating:
  - { text: "תזכיר לי מה כתבתי על דני", allow: [records, full] }
  - { text: "מה רשמתי על הפגישה עם המשקיעים?", allow: [records, full] }
  - { text: "יש לי משימה לקבוע תור לרופא", allow: [records, time, full] }
  - { text: "תשמור לי את השעה של הטיסה", allow: [records, time, full] }
  - { text: "מתי הפגישה עם רונית? תכתוב לי את זה", allow: [time, records, full] }
  - { text: "כמה עולה פגישה אצל הפסיכולוגית?", allow: [records, info, full] }
  - { text: "מה השעה עכשיו בניו יורק?", allow: [info, full] }
  - { text: "מה שירות הלקוחות של בזק?", allow: [info, full] }
  - { text: "יש לי קובץ הוצאות, תסכם לי אותו", allow: [records, full] }
  - { text: "תפתח לי את המסמך מהמייל של אתמול", allow: [mail, drive, full] }
  - { text: "מה ההודעה האחרונה ששלחו לי בווטסאפ?", allow: [phone, full] }
  - { text: "מתי נכנסת שבת?", allow: [info, full] }
  - { text: "כמה ימים נשארו עד החופש?", allow: [info, time, full] }
  - { text: "תמחק את הפתק על החניה", allow: [records] }
  - { text: "סיימתי את המשימה של הכביסה", allow: [records, full] }
  - { text: "תרשום שהפגישה עם דני עברה ליום שני", allow: [time, records, full] }
  - { text: "תזכיר לי את הסיסמה של הוויי-פיי", allow: [records, full] }
  - { text: "יש מבצע על טיסות? תבדוק לי", allow: [info, full] }
  - { text: "מה היה בפגישה של אתמול לפי המייל?", allow: [mail, full] }
  - { text: "כמה עלה לי החשמל בחודש שעבר?", allow: [records, full] }
  - { text: "מה החדשות? ותזכיר לי לקום מוקדם", allow: [full] }
  - { text: "תזכור שהחניה בקומה מינוס שתיים", allow: [records, full] }
  - { text: "תזכור שאני אלרגי לבוטנים", allow: [records, full] }
  # A bill paid is an expense; a bill to pay is in the mail (2026-10-06).
  - { text: "שילמתי את החשבונית של החשמל, 300 שקל", allow: [records, full] }
  - { text: "תנווט לפגישה הבאה שלי", allow: [phone, time, full] }
